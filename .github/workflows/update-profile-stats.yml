name: 更新档案数据 / Update Profile Stats

on:
  schedule:
    # 每周一 11:17（北京时间）刷新一次
    # Refresh weekly on Monday at 11:17 (UTC+8)
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/update-profile-stats.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库 / Checkout repository
        uses: actions/checkout@v4

      - name: 准备 Python / Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成 GitHub 统计数据 / Generate GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_stats.py --user Xinyang-Gao

      - name: 提交变更 / Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README 无变化，跳过提交 / No changes in README, skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): 更新 GitHub 语言与统计数据 / update GitHub language & stats"
          git push