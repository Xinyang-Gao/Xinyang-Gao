name: 同步最近文章 / Sync Recent Posts

on:
  schedule:
    # 每天 08:23（北京时间）拉取一次博客 RSS
    # Fetch the blog RSS once a day at 08:23 (UTC+8)
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog-posts:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库 / Checkout repository
        uses: actions/checkout@v4

      - name: 拉取最新文章 / Fetch latest posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "BLOG-POST-LIST"
          feed_list: "https://xinyang-gao.github.io/rss.xml"
          max_post_count: 5
          readme_path: "README.md"
          template: '<a href="$url"><b>$title</b></a> · <sub>$date</sub><br>'
          date_format: "yyyy年MM月dd日"
          gh_token: ${{ secrets.GITHUB_TOKEN }}